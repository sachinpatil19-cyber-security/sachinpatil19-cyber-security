<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform" type="rotate"
        from="0 0.5 0.5" to="360 0.5 0.5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .bg { fill: #0b0f14; }
      .border {
        fill: none;
        stroke: url(#glow);
        stroke-width: 2.5;
      }
      .label { fill: #94a3b8; font: 600 12px 'Segoe UI', sans-serif; letter-spacing: 1.5px; }
      .title { fill: #f8fafc; font: 700 32px 'Segoe UI', sans-serif; }
      .subtitle { fill: #e2e8f0; font: 600 18px 'Segoe UI', sans-serif; }
      .body { fill: #cbd5e1; font: 400 14px 'Segoe UI', sans-serif; }
      .bullet { fill: #f8fafc; font: 700 14px 'Segoe UI', sans-serif; }
      .link { fill: #38bdf8; font: 600 14px 'Segoe UI', sans-serif; }
      .divider { stroke: #1e293b; stroke-width: 1; }
      .pulse-dot {
        fill: #22d3ee;
      }
    </style>
  </defs>

  <!-- background card -->
  <rect x="8" y="8" width="944" height="284" rx="16" class="bg"/>

  <!-- animated glowing border -->
  <rect x="8" y="8" width="944" height="284" rx="16" class="border" filter="url(#softGlow)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing corner dot, top right -->
  <circle cx="924" cy="28" r="5" class="pulse-dot">
    <animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- content -->
  <text x="40" y="48" class="label">RECRUITER SIGNAL BRIEF &#183; SACHINPATIL19-CYBER-SECURITY</text>

  <line x1="40" y1="64" x2="920" y2="64" class="divider"/>

  <text x="40" y="108" class="title">sachinpatil19-cyber-security</text>

  <text x="40" y="142" class="subtitle">VAPT | Web, API &amp; Network Penetration Testing</text>

  <text x="40" y="175" class="body">Cyber Security Associate &#8212; full VAPT lifecycle, OWASP methodology, CVSS-based reporting.</text>

  <circle cx="46" cy="205" r="3.5" class="pulse-dot">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="60" y="210" class="bullet">45+ VAPT engagements across 10+ client environments</text>

  <a href="https://github.com/sachinpatil19-cyber-security">
    <text x="40" y="250" class="link">GitHub</text>
  </a>
  <text x="100" y="250" class="body">&#183;</text>
  <a href="https://linkedin.com/in/sachin-patil-9ab496316">
    <text x="115" y="250" class="link">LinkedIn</text>
  </a>
  <text x="185" y="250" class="body">&#183;</text>
  <a href="https://sachincybersecurity.page.gd/">
    <text x="200" y="250" class="link">Portfolio</text>
  </a>
</svg>
