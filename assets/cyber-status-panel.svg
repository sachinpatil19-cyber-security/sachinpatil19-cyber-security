<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Animated cyber security system status panel">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#35070c"/><stop offset="1" stop-color="#11102a"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="1" y="1" width="998" height="188" rx="14" fill="url(#bg)" stroke="#1d5265" stroke-width="2"/><path d="M20 45 H980" stroke="#173044"/><text x="28" y="30" fill="#ff2b2b" font-family="monospace" font-size="15" letter-spacing="3">SECURITY OPERATIONS // STATUS MONITOR</text><circle cx="960" cy="25" r="5" fill="#ff3b3b" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
<g font-family="monospace"><text x="30" y="76" fill="#93a4b8" font-size="12">WEB VAPT</text><text x="30" y="102" fill="#ff3b3b" font-size="19">ACTIVE</text><rect x="30" y="118" width="270" height="5" rx="2" fill="#1b3345"/><rect x="30" y="118" width="240" height="5" rx="2" fill="#ff2b2b"><animate attributeName="width" values="180;250;210;240" dur="4s" repeatCount="indefinite"/></rect>
<text x="365" y="76" fill="#93a4b8" font-size="12">RECON / VALIDATION</text><text x="365" y="102" fill="#ff2b2b" font-size="19">RUNNING</text><rect x="365" y="118" width="270" height="5" rx="2" fill="#1b3345"/><rect x="365" y="118" width="210" height="5" rx="2" fill="#a855f7"><animate attributeName="width" values="90;240;170;210" dur="3.2s" repeatCount="indefinite"/></rect>
<text x="700" y="76" fill="#93a4b8" font-size="12">REPORTING</text><text x="700" y="102" fill="#a855f7" font-size="19">READY</text><rect x="700" y="118" width="270" height="5" rx="2" fill="#1b3345"/><rect x="700" y="118" width="250" height="5" rx="2" fill="#ff3b3b"><animate attributeName="opacity" values="1;.55;1" dur="2s" repeatCount="indefinite"/></rect></g>
<text x="30" y="160" fill="#607d93" font-family="monospace" font-size="11">AUTHORIZED ENVIRONMENTS ONLY</text><text x="970" y="160" text-anchor="end" fill="#607d93" font-family="monospace" font-size="11">ENCRYPTED LINK // ESTABLISHED</text>
</svg>