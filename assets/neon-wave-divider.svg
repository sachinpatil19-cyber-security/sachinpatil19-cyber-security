<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="Animated neon waveform divider">
<defs><linearGradient id="wave"><stop stop-color="#00f5ff"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#00ff9c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="70" rx="8" fill="#070b14"/><path d="M0 35 Q75 5 150 35 T300 35 T450 35 T600 35 T750 35 T900 35 T1050 35 T1200 35" fill="none" stroke="#193044" stroke-width="2"/><path d="M0 35 Q75 5 150 35 T300 35 T450 35 T600 35 T750 35 T900 35 T1050 35 T1200 35" fill="none" stroke="url(#wave)" stroke-width="3" filter="url(#glow)" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" from="0" to="-80" dur="2.2s" repeatCount="indefinite"/></path><g fill="#00f5ff" filter="url(#glow)"><circle cx="150" cy="35" r="3"><animate attributeName="r" values="2;5;2" dur="1.3s" repeatCount="indefinite"/></circle><circle cx="600" cy="35" r="3"><animate attributeName="r" values="5;2;5" dur="1.5s" repeatCount="indefinite"/></circle><circle cx="1050" cy="35" r="3"><animate attributeName="r" values="2;5;2" dur="1.7s" repeatCount="indefinite"/></circle></g></svg>