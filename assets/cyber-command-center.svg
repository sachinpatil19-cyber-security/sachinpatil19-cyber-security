<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Sachin Patil Cybersecurity Command Center</title>
<desc id="desc">A futuristic cybersecurity dashboard with neon #ff2b2b and violet panels, system telemetry, terminal output, and project status.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050913"/><stop offset=".55" stop-color="#0a1020"/><stop offset="1" stop-color="#10091e"/></linearGradient>
  <linearGradient id="#ff2b2b" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff2b2b"/><stop offset="1" stop-color="#3478ff"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#ec4899"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#101d31" stop-opacity=".96"/><stop offset="1" stop-color="#080d19" stop-opacity=".98"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#15304a" stroke-width="1" opacity=".48"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<rect width="1200" height="680" rx="22" fill="url(#bg)"/>
<rect width="1200" height="680" rx="22" fill="url(#grid)"/>
<ellipse cx="1030" cy="110" rx="170" ry="110" fill="#8b5cf6" opacity=".12" filter="url(#soft)"/>
<ellipse cx="130" cy="560" rx="190" ry="110" fill="#00e5ff" opacity=".10" filter="url(#soft)"/>
<!-- frame -->
<path d="M22 74V22H1180V658H22V612" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity=".65"/>
<path d="M22 112V92H42 M1158 92H1178V112 M22 568V588H42 M1158 588H1178V568" fill="none" stroke="#a855f7" stroke-width="3"/>
<!-- top system bar -->
<rect x="36" y="36" width="1128" height="42" rx="7" fill="#0b1424" stroke="#1e4761"/>
<circle cx="57" cy="57" r="5" fill="#ff4d6d"/><circle cx="75" cy="57" r="5" fill="#ffbe55"/><circle cx="93" cy="57" r="5" fill="#ff3b3b"/>
<text x="115" y="62" fill="#7dd3fc" font-family="monospace" font-size="13" letter-spacing="2">S.PATIL // CYBERSECURITY OPERATIONS</text>
<text x="1138" y="62" fill="#ff3b3b" font-family="monospace" font-size="12" text-anchor="end">● SYSTEM ONLINE</text>
<!-- hero -->
<text x="48" y="135" fill="#00e5ff" font-family="monospace" font-size="12" letter-spacing="4">SECURITY RESEARCHER / VAPT ANALYST</text>
<text x="46" y="194" fill="#f1f5f9" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="800">SACHIN PATIL</text>
<text x="49" y="229" fill="#9ca3af" font-family="monospace" font-size="17">Explore systems. Validate risk. Engineer defense.</text>
<path d="M48 249H692" stroke="url(##ff2b2b)" stroke-width="2" filter="url(#glow)"/>
<!-- status cards -->
<g>
 <rect x="48" y="270" width="202" height="82" rx="9" fill="url(#panel)" stroke="#12617a"/>
 <text x="65" y="294" fill="#67e8f9" font-family="monospace" font-size="11" letter-spacing="1.5">PRIMARY DOMAIN</text>
 <text x="65" y="324" fill="#f8fafc" font-family="Arial" font-size="19" font-weight="700">WEB VAPT</text>
 <text x="65" y="340" fill="#64748b" font-family="monospace" font-size="10">APP / API / NETWORK</text>
 <rect x="263" y="270" width="202" height="82" rx="9" fill="url(#panel)" stroke="#6d28d9"/>
 <text x="280" y="294" fill="#c4b5fd" font-family="monospace" font-size="11" letter-spacing="1.5">FEATURED PROJECT</text>
 <text x="280" y="321" fill="#f8fafc" font-family="Arial" font-size="16" font-weight="700">SECURITY REPORT</text>
 <text x="280" y="340" fill="#a78bfa" font-family="monospace" font-size="10">REPO LINK BELOW ↘</text>
 <rect x="478" y="270" width="214" height="82" rx="9" fill="url(#panel)" stroke="#146b58"/>
 <text x="495" y="294" fill="#6ee7b7" font-family="monospace" font-size="11" letter-spacing="1.5">WORKFLOW</text>
 <text x="495" y="321" fill="#f8fafc" font-family="Arial" font-size="16" font-weight="700">RECON → REPORT</text>
 <text x="495" y="340" fill="#64748b" font-family="monospace" font-size="10">TEST / VERIFY / REMEDIATE</text>
</g>
<!-- terminal panel -->
<rect x="48" y="374" width="644" height="238" rx="10" fill="#050a13" stroke="#17435a"/>
<rect x="48" y="374" width="644" height="34" rx="10" fill="#0e1b2b"/>
<path d="M48 398H692" stroke="#17435a"/>
<text x="65" y="396" fill="#7dd3fc" font-family="monospace" font-size="12">root@security-lab: ~/mission-control</text>
<text x="65" y="436" fill="#ff3b3b" font-family="monospace" font-size="13">$ ./initialize_assessment.sh</text>
<text x="65" y="461" fill="#cbd5e1" font-family="monospace" font-size="12">[ OK ] Reconnaissance workflow loaded</text>
<text x="65" y="484" fill="#cbd5e1" font-family="monospace" font-size="12">[ OK ] Web application test toolkit ready</text>
<text x="65" y="507" fill="#cbd5e1" font-family="monospace" font-size="12">[ OK ] Evidence and reporting module ready</text>
<text x="65" y="530" fill="#c4b5fd" font-family="monospace" font-size="12">[ INFO ] Responsible testing only</text>
<text x="65" y="565" fill="#00e5ff" font-family="monospace" font-size="13">$ status --all</text>
<text x="65" y="589" fill="#ff3b3b" font-family="monospace" font-size="12">READY FOR NEXT ENGAGEMENT_</text>
<!-- right telemetry -->
<rect x="716" y="122" width="448" height="490" rx="12" fill="url(#panel)" stroke="#24516c"/>
<text x="742" y="154" fill="#67e8f9" font-family="monospace" font-size="12" letter-spacing="2">LIVE TELEMETRY // SKILL MATRIX</text>
<path d="M742 168H1138" stroke="#1c4962"/>
<!-- radar -->
<g transform="translate(940 270)">
 <circle r="82" fill="none" stroke="#164e63" stroke-width="1"/>
 <circle r="60" fill="none" stroke="#164e63" stroke-width="1"/>
 <circle r="38" fill="none" stroke="#164e63" stroke-width="1"/>
 <path d="M-90 0H90 M0 -90V90 M-64 -64L64 64 M-64 64L64 -64" stroke="#164e63" stroke-width="1"/>
 <circle r="72" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="8 8" opacity=".8"/>
 <path d="M0 0L10 -68A69 69 0 0 1 55 -42Z" fill="#00e5ff" opacity=".15"/>
 <circle r="7" fill="#00e5ff" filter="url(#glow)"/>
 <circle cx="33" cy="-29" r="4" fill="#a855f7" filter="url(#glow)"/>
 <circle cx="-45" cy="20" r="4" fill="#ff3b3b" filter="url(#glow)"/>
 <circle cx="15" cy="48" r="3" fill="#f472b6"/>
</g>
<text x="940" y="373" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle" letter-spacing="2">THREAT SURFACE / VISUAL MODEL</text>
<!-- skill bars -->
<text x="742" y="411" fill="#e2e8f0" font-family="monospace" font-size="12">WEB APPLICATION SECURITY</text>
<rect x="742" y="422" width="396" height="6" rx="3" fill="#1e293b"/><rect x="742" y="422" width="305" height="6" rx="3" fill="url(##ff2b2b)"/>
<text x="742" y="454" fill="#e2e8f0" font-family="monospace" font-size="12">BURP SUITE / TRAFFIC ANALYSIS</text>
<rect x="742" y="465" width="396" height="6" rx="3" fill="#1e293b"/><rect x="742" y="465" width="276" height="6" rx="3" fill="url(#violet)"/>
<text x="742" y="497" fill="#e2e8f0" font-family="monospace" font-size="12">REPORTING / REMEDIATION</text>
<rect x="742" y="508" width="396" height="6" rx="3" fill="#1e293b"/><rect x="742" y="508" width="334" height="6" rx="3" fill="#ff3b3b"/>
<rect x="742" y="542" width="396" height="43" rx="6" fill="#0b1624" stroke="#214258"/>
<circle cx="760" cy="563" r="5" fill="#ff3b3b" filter="url(#glow)"/>
<text x="775" y="567" fill="#cbd5e1" font-family="monospace" font-size="11">SECURE BY DESIGN // ETHICAL TESTING</text>
<!-- footer -->
<text x="48" y="646" fill="#64748b" font-family="monospace" font-size="10" letter-spacing="2">ACCESS AUTHORIZED SYSTEMS ONLY</text>
<text x="1152" y="646" fill="#00e5ff" font-family="monospace" font-size="10" text-anchor="end">VAPT // WEB // API // NETWORK</text>
<!-- scanline -->
<rect x="24" y="96" width="1152" height="2" fill="#ff2b2b" opacity=".5">
  <animate attributeName="y" values="96;625;96" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".05;.45;.05" dur="7s" repeatCount="indefinite"/>
</rect>
</svg>